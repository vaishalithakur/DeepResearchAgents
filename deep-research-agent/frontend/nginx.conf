server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so client-side
    # routing (if added later) still works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + SSE traffic to the backend container (service name `backend`
    # resolves via Docker Compose's internal DNS).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE streaming needs buffering disabled, or nginx will wait for the
        # response to finish before forwarding any bytes to the client.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
